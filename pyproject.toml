[project]
name = "devcoordinator2"
version = "0.1.0"
description = "Server-wide development coordinator: immediate tests and deployment operation"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
devcoordinator2 = "devcoordinator2.client.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
