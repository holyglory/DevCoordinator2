name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rust:
    name: Rust executor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      - name: Build release executor
        run: cargo build --locked --release --package devcoordinator2-executor

  product-python:
    name: Product Python
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install product test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint product source
        run: ruff check src tests scripts
      - name: Run product unit tests
        run: pytest

  edge:
    name: Edge runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Run edge tests and syntax checks
        run: |
          node --test edge/test/edge.test.mjs
          node --check console/app.js
          node --check console/verify.mjs

  six-skill-validation:
    name: Six canonical skills (${{ matrix.os }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ci/playwright/package-lock.json

      - name: Install locked Playwright runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix ci/playwright
          echo "NODE_PATH=$GITHUB_WORKSPACE/ci/playwright/node_modules" >> "$GITHUB_ENV"

      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: ci/playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        run: ci/playwright/node_modules/.bin/playwright install chromium

      - name: Build release Rust executor
        run: cargo build --locked --release --package devcoordinator2-executor

      - name: Run complete repository validation
        run: python3 scripts/skills/validate.py

      - name: Run rendered Console verification
        if: runner.os == 'Linux'
        run: node console/verify.mjs
