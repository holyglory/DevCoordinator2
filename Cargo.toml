[workspace]
members = [
    "rust/api",
    "rust/control",
    "rust/tooling",
    "rust/executor-protocol",
    "rust/executor-core",
    "rust/devcoordinator2-executor",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=0.9.11"
rustix = { version = "=1.1.4", features = ["fs", "pipe", "process"] }
quick-xml = "=0.39.4"
base64 = "=0.22.1"
clap = { version = "=4.6.6", features = ["derive"] }
getrandom = "=0.3.4"
ignore = "=0.4.33"
regex = "=1.11.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
schemars = { version = "=1.2.1", features = ["derive"] }
thiserror = "=2.0.17"
time = { version = "=0.3.47", features = ["formatting", "macros", "parsing", "serde"] }
tokio-util = "=0.7.16"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
